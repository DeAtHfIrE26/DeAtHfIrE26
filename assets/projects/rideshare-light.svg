<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="RideShare Incentive Showcase — shell, motion system and release hygiene from a production carpooling platform">
  <title>RideShare Incentive Showcase</title>
  <desc>A car travelling a dashed route between two map pins, with counters for shared rides and incentive points.</desc>
  <defs>
    <linearGradient id="sky-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="rule-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="halo-light" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#bfdbfe" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#bfdbfe" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .title { font: 700 44px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .tag   { font: 400 19px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #475569; }
    .num   { font: 700 21px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
    .lab   { font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #475569; letter-spacing: .06em; text-transform: uppercase; }
    .pin   { fill: #1d4ed8; }

    @keyframes dash { to { stroke-dashoffset: -64; } }
    .route { stroke: #94a3b8; stroke-width: 4; stroke-linecap: round; fill: none;
              stroke-dasharray: 16 16; animation: dash 1.6s linear infinite; }

    @keyframes drive {
      0%   { transform: translate(196px, 0px); }
      48%  { transform: translate(742px, -6px); }
      52%  { transform: translate(742px, -6px); }
      100% { transform: translate(196px, 0px); }
    }
    .car { animation: drive 7s cubic-bezier(.42,0,.58,1) infinite; }

    @keyframes halo { 0%,100% { opacity: .35; } 50% { opacity: .8; } }
    .halo { animation: halo 7s ease-in-out infinite; }

    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .in1 { animation: rise .7s cubic-bezier(.16,1,.3,1) both; }
    .in2 { animation: rise .7s .12s cubic-bezier(.16,1,.3,1) both; }
    .in3 { animation: rise .7s .24s cubic-bezier(.16,1,.3,1) both; }

    /* Everything settles into its final frame rather than moving. */
    @media (prefers-reduced-motion: reduce) {
      .route { animation: none; }
      .car   { animation: none; transform: translate(470px, -3px); }
      .halo  { animation: none; opacity: .5; }
      .in1, .in2, .in3 { animation: none; opacity: 1; transform: none; }
    }
  </style>

  <rect width="1200" height="360" fill="url(#sky-light)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#rule-light)"/>

  <g class="in1">
    <text x="72" y="118" class="title">RideShare Incentive Showcase</text>
    <text x="72" y="152" class="tag">The shell, the motion system and the release-hygiene checks — from a production carpooling platform.</text>
  </g>

  <!-- Route. The translate and the entrance animation are on different
       elements: a CSS transform would otherwise override the attribute. -->
  <g transform="translate(0,238)">
   <g class="in2">
    <path class="route" d="M196 0 H 796"/>

    <g transform="translate(196,0)">
      <ellipse class="halo" cx="0" cy="0" rx="46" ry="16" fill="url(#halo-light)"/>
      <path class="pin" d="M0-34a13 13 0 0 1 13 13c0 9.6-13 21-13 21S-13-2.4-13-21A13 13 0 0 1 0-34z"/>
      <circle cx="0" cy="-21" r="4.6" fill="#ffffff"/>
    </g>
    <g transform="translate(796,0)">
      <ellipse class="halo" cx="0" cy="0" rx="46" ry="16" fill="url(#halo-light)"/>
      <path class="pin" d="M0-34a13 13 0 0 1 13 13c0 9.6-13 21-13 21S-13-2.4-13-21A13 13 0 0 1 0-34z"/>
      <circle cx="0" cy="-21" r="4.6" fill="#ffffff"/>
    </g>

    <!-- Car -->
    <g class="car">
      <g transform="translate(-26,-30)">
        <path d="M4 20 L8 8.6 C9 5.3 12 3 15.5 3 H36.5 C40 3 43 5.3 44 8.6 L48 20 Z" fill="#1d4ed8"/>
        <rect x="0" y="18" width="52" height="12" rx="5" fill="#1d4ed8"/>
        <circle cx="13" cy="31" r="5.4" fill="#0f172a"/>
        <circle cx="39" cy="31" r="5.4" fill="#0f172a"/>
        <circle cx="13" cy="31" r="2.2" fill="#ffffff"/>
        <circle cx="39" cy="31" r="2.2" fill="#ffffff"/>
      </g>
    </g>
   </g>
  </g>

  <g class="in3">

  <style>
    @keyframes tick-Sharedrides { 0.0000%,14.4000% { transform: translateY(0px); }
20.0000%,34.4000% { transform: translateY(-26px); }
40.0000%,54.4000% { transform: translateY(-52px); }
60.0000%,74.4000% { transform: translateY(-78px); }
80.0000%,94.4000% { transform: translateY(-104px); }
 }
    .strip-Sharedrides { animation: tick-Sharedrides 5.5s steps(1, end) infinite; }
    @media (prefers-reduced-motion: reduce) {
      .strip-Sharedrides { animation: none; transform: translateY(-104px); }
    }
  </style>
  <g transform="translate(852,214)">
    <rect x="-14" y="-30" width="188" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <clipPath id="clip-Sharedrides"><rect x="-8" y="-24" width="176" height="30"/></clipPath>
    <g clip-path="url(#clip-Sharedrides)">
      <g class="strip-Sharedrides"><text x="0" y="0" class="num">1 204</text><text x="0" y="26" class="num">2 871</text><text x="0" y="52" class="num">5 330</text><text x="0" y="78" class="num">8 942</text><text x="0" y="104" class="num">12 480</text></g>
    </g>
    <text x="0" y="26" class="lab">Shared rides</text>
  </g>

  <style>
    @keyframes tick-Incentivepoints { 0.0000%,14.4000% { transform: translateY(0px); }
20.0000%,34.4000% { transform: translateY(-26px); }
40.0000%,54.4000% { transform: translateY(-52px); }
60.0000%,74.4000% { transform: translateY(-78px); }
80.0000%,94.4000% { transform: translateY(-104px); }
 }
    .strip-Incentivepoints { animation: tick-Incentivepoints 5.5s steps(1, end) infinite; }
    @media (prefers-reduced-motion: reduce) {
      .strip-Incentivepoints { animation: none; transform: translateY(-104px); }
    }
  </style>
  <g transform="translate(852,300)">
    <rect x="-14" y="-30" width="188" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <clipPath id="clip-Incentivepoints"><rect x="-8" y="-24" width="176" height="30"/></clipPath>
    <g clip-path="url(#clip-Incentivepoints)">
      <g class="strip-Incentivepoints"><text x="0" y="0" class="num">18 400</text><text x="0" y="26" class="num">44 210</text><text x="0" y="52" class="num">96 750</text><text x="0" y="78" class="num">161 320</text><text x="0" y="104" class="num">248 090</text></g>
    </g>
    <text x="0" y="26" class="lab">Incentive points</text>
  </g>
  </g>
</svg>
