<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Merkle Verify — leaves hash upward into a root, then one leaf's inclusion proof lights up and verifies.">
<style>
@keyframes appear{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes rise{0%{opacity:0;stroke-dashoffset:var(--len)}100%{opacity:1;stroke-dashoffset:0}}
@keyframes lightPath{0%,48%{fill:#262B35}60%,100%{fill:#7C6BF5}}
@keyframes lightSib{0%,50%{fill:#262B35}62%,100%{fill:#2DD4A7}}
@keyframes lightEdge{0%,50%{stroke:#262B35;stroke-width:1.5}62%,100%{stroke:#7C6BF5;stroke-width:2.6}}
@keyframes halo{0%,52%{opacity:0}66%,100%{opacity:0.20}}
@keyframes tick{0%,64%{stroke-dashoffset:42;opacity:0}72%{opacity:1}80%,100%{stroke-dashoffset:0;opacity:1}}
@keyframes fadeIn{0%,66%{opacity:0}78%,100%{opacity:1}}
.n{transform-box:fill-box;transform-origin:center;animation:appear .5s cubic-bezier(.16,1,.3,1) both}
.e{animation:rise .5s ease-out both}
.p{animation:lightPath 7s ease-in-out infinite}
.s{animation:lightSib 7s ease-in-out infinite}
.pe{animation:lightEdge 7s ease-in-out infinite}
.h{animation:halo 7s ease-in-out infinite}
.tk{stroke-dasharray:42;animation:tick 7s ease-in-out infinite}
.fi{animation:fadeIn 7s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.n,.e,.p,.s,.pe,.h,.tk,.fi{animation:none!important}.p{fill:#7C6BF5}.s{fill:#2DD4A7}.pe{stroke:#7C6BF5;stroke-width:2.6}.h{opacity:0.20}.tk{stroke-dashoffset:0;opacity:1}.fi{opacity:1}}
</style>
