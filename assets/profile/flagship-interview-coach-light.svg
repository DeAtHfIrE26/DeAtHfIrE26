<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 424" width="1200" height="424" role="img" aria-labelledby="t d">
<title id="t">AI Interview Coach</title>
<desc id="d">GEN AI · COMPUTER VISION · PATENTED. An interview simulator with lip-sync verification, gaze tracking and voice authentication, generating adaptive questions and behavioural analytics. Published at IEEE ICCCNT-2025 and patented.</desc>
<defs>
    <clipPath id="pclip"><rect x="1" y="1" width="1198" height="422" rx="18"/></clipPath>
    <filter id="pblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="86"/></filter>
    <pattern id="pdots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#eef1f5"/></pattern>
    <linearGradient id="pedge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b45309" stop-opacity="0"/><stop offset=".5" stop-color="#b45309"/><stop offset="1" stop-color="#0e7490" stop-opacity="0"/></linearGradient></defs>
<style>
  text{white-space:pre}
  .in{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.5)}}
  
    .blob{animation:drift 16s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
    .b2{animation-duration:19s;animation-direction:alternate-reverse}.b3{animation-duration:23s}
    @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6%,8%) scale(1.15)}100%{transform:translate(-5%,-4%) scale(.9)}}
    .sweep{stroke-dasharray:390 2858;animation:sweep 9s linear infinite}
    @keyframes sweep{to{stroke-dashoffset:-3248}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rm-show{opacity:1!important;transform:none!important}}
  @media (prefers-reduced-motion:reduce){.in,.px,.bdg{opacity:1!important}.tl{stroke-dashoffset:0!important}}
</style>

    <rect x="1" y="1" width="1198" height="422" rx="18" fill="#ffffff"/>
    
    <g clip-path="url(#pclip)" filter="url(#pblur)" opacity="0.16">
