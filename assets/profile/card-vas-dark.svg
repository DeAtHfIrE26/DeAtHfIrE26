<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" width="600" height="290" role="img" aria-labelledby="t d">
<title id="t">MemoTag Voice Analysis</title>
<desc id="d">SPEECH. Speech transcription and audio-feature analysis for spotting cognitive signals in voice recordings. Built with Python, Whisper, Vosk, librosa, Streamlit.</desc>
<defs>
    <clipPath id="cclip"><rect x="1" y="1" width="598" height="288" rx="18"/></clipPath>
    <filter id="cblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="43"/></filter>
    <pattern id="cdots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#1b2433"/></pattern>
    <linearGradient id="cedge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient></defs>
<style>
  text{white-space:pre}
  .in{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.5)}}
  
    .blob{animation:drift 16s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
    .b2{animation-duration:19s;animation-direction:alternate-reverse}.b3{animation-duration:23s}
    @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6%,8%) scale(1.15)}100%{transform:translate(-5%,-4%) scale(.9)}}
    .sweep{stroke-dasharray:214 1566;animation:sweep 9s linear infinite}
    @keyframes sweep{to{stroke-dashoffset:-1780}}
  .gscan{animation:gs 2s ease-in-out infinite alternate}@keyframes gs{to{transform:translateY(20px)}}
  .gscan2{animation:gs2 2.2s ease-in-out infinite alternate}@keyframes gs2{to{transform:translateY(50px)}}
  .gdash{stroke-dasharray:140;animation:gd 2.4s linear infinite}@keyframes gd{from{stroke-dashoffset:280}to{stroke-dashoffset:0}}
  .gbar{transform-box:fill-box;transform-origin:center;animation:gb .8s ease-in-out infinite alternate}@keyframes gb{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
  .gdot{animation:gdot 1.2s ease-in-out infinite}@keyframes gdot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
  .gnode{transform-box:fill-box;transform-origin:center;animation:gn 1.6s ease-in-out infinite}@keyframes gn{50%{transform:scale(1.5);opacity:.6}}
  .gspin{animation:spin 3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .gcell{opacity:.25;animation:gc 1.8s ease-in-out infinite}@keyframes gc{30%{opacity:1}60%{opacity:.25}}
  .gjump{animation:gj 1s cubic-bezier(.3,0,.7,1) infinite alternate}@keyframes gj{to{transform:translateY(-22px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rm-show{opacity:1!important;transform:none!important}}
  @media (prefers-reduced-motion:reduce){.in,.px,.bdg{opacity:1!important}.tl{stroke-dashoffset:0!important}}
</style>

    <rect x="1" y="1" width="598" height="288" rx="18" fill="#0f1520"/>
    
    <g clip-path="url(#cclip)" filter="url(#cblur)" opacity="0.35">
      <circle class="blob b1" cx="108" cy="58" r="132" fill="#22d3ee"/>
      <circle class="blob b2" cx="510" cy="101.5" r="108" fill="#22d3ee"/>
      <circle class="blob b3" cx="330" cy="304.5" r="120" fill="#a78bfa"/>
    </g>
    <rect x="1" y="1" width="598" height="288" rx="18" fill="url(#cdots)" opacity="0.9"/>
    <rect x="1" y="1" width="598" height="288" rx="18" fill="none" stroke="#263041" stroke-width="1.5"/>
    <rect x="1" y="1" width="598" height="288" rx="18" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" class="sweep" opacity="0.75"/>
    <g class="in"><text x="32" y="50" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="2.5" fill="#22d3ee">SPEECH<tspan fill="#8b949e"> · 2025</tspan></text>
    <text x="32" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="29" font-weight="800" letter-spacing="-.5" fill="#e6edf3">MemoTag Voice Analysis</text></g>
    <g><rect class="gbar" style="animation-delay:0.0s" x="504" y="44" width="5" height="36" rx="2.5" fill="#22d3ee"/><rect class="gbar" style="animation-delay:0.1s" x="513" y="44" width="5" height="36" rx="2.5" fill="#22d3ee"/><rect class="gbar" style="animation-delay:0.2s" x="522" y="44" width="5" height="36" rx="2.5" fill="#22d3ee"/><rect class="gbar" style="animation-delay:0.3s" x="531" y="44" width="5" height="36" rx="2.5" fill="#22d3ee"/><rect class="gbar" style="animation-delay:0.4s" x="540" y="44" width="5" height="36" rx="2.5" fill="#22d3ee"/><rect class="gbar" style="animation-delay:0.5s" x="549" y="44" width="5" height="36" rx="2.5" fill="#22d3ee"/><rect class="gbar" style="animation-delay:0.6s" x="558" y="44" width="5" height="36" rx="2.5" fill="#22d3ee"/></g>
    <g class="in" style="animation-delay:0.15s"><text x="32" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">Speech transcription and audio-feature analysis for spotting</text><text x="32" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">cognitive signals in voice recordings.</text></g>
    <g class="in" style="animation-delay:0.30s"><g><rect x="32" y="230" width="65" height="26" rx="13" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.45"/><text x="64.5" y="247.32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#22d3ee">Python</text></g><g><rect x="105" y="230" width="72" height="26" rx="13" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.45"/><text x="141" y="247.32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#22d3ee">Whisper</text></g><g><rect x="185" y="230" width="51" height="26" rx="13" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.45"/><text x="210.5" y="247.32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#22d3ee">Vosk</text></g><g><rect x="244" y="230" width="72" height="26" rx="13" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.45"/><text x="280" y="247.32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#22d3ee">librosa</text></g><g><rect x="324" y="230" width="87" height="26" rx="13" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.45"/><text x="367.5" y="247.32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#22d3ee">Streamlit</text></g></g>
</svg>
