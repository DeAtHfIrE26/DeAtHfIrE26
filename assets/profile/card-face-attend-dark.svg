<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" width="600" height="290" role="img" aria-labelledby="t d">
<title id="t">Unified Face Attend</title>
<desc id="d">COMPUTER VISION. Multi-face attendance at 98% precision, with active anti-spoofing and real-time Firebase cloud sync. Published at INCONSYM-2025. Built with Python, OpenCV, DeepFace, Firebase.</desc>
<defs>
    <clipPath id="cclip"><rect x="1" y="1" width="598" height="288" rx="18"/></clipPath>
    <filter id="cblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="43"/></filter>
    <pattern id="cdots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#1b2433"/></pattern>
    <linearGradient id="cedge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399" stop-opacity="0"/><stop offset=".5" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient></defs>
<style>
  text{white-space:pre}
  .in{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.5)}}
  
    .blob{animation:drift 16s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
    .b2{animation-duration:19s;animation-direction:alternate-reverse}.b3{animation-duration:23s}
    @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6%,8%) scale(1.15)}100%{transform:translate(-5%,-4%) scale(.9)}}
    .sweep{stroke-dasharray:214 1566;animation:sweep 9s linear infinite}
    @keyframes sweep{to{stroke-dashoffset:-1780}}
  .gscan{animation:gs 2s ease-in-out infinite alternate}@keyframes gs{to{transform:translateY(20px)}}
  .gscan2{animation:gs2 2.2s ease-in-out infinite alternate}@keyframes gs2{to{transform:translateY(50px)}}
  .gdash{stroke-dasharray:36 110;animation:gd 1.8s linear infinite}@keyframes gd{from{stroke-dashoffset:146}to{stroke-dashoffset:0}}
  .gbar{transform-box:fill-box;transform-origin:center;animation:gb .8s ease-in-out infinite alternate}@keyframes gb{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
  .gdot{animation:gdot 1.2s ease-in-out infinite}@keyframes gdot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
  .gnode{transform-box:fill-box;transform-origin:center;animation:gn 1.6s ease-in-out infinite}@keyframes gn{50%{transform:scale(1.5);opacity:.6}}
  .gspin{animation:spin 3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .gcell{opacity:.25;animation:gc 1.8s ease-in-out infinite}@keyframes gc{30%{opacity:1}60%{opacity:.25}}
  .gjump{animation:gj 1s cubic-bezier(.3,0,.7,1) infinite alternate}@keyframes gj{to{transform:translateY(-22px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rm-show{opacity:1!important;transform:none!important}}
  @media (prefers-reduced-motion:reduce){.in,.px,.bdg{opacity:1!important}.tl{stroke-dashoffset:0!important}}
</style>

    <rect x="1" y="1" width="598" height="288" rx="18" fill="#0f1520"/>
    
    <g clip-path="url(#cclip)" filter="url(#cblur)" opacity="0.35">
      <circle class="blob b1" cx="108" cy="58" r="132" fill="#34d399"/>
      <circle class="blob b2" cx="510" cy="101.5" r="108" fill="#22d3ee"/>
      <circle class="blob b3" cx="330" cy="304.5" r="120" fill="#a78bfa"/>
    </g>
    <rect x="1" y="1" width="598" height="288" rx="18" fill="url(#cdots)" opacity="0.9"/>
    <rect x="1" y="1" width="598" height="288" rx="18" fill="none" stroke="#263041" stroke-width="1.5"/>
    <rect x="1" y="1" width="598" height="288" rx="18" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" class="sweep" opacity="0.75"/>
    <g class="in"><text x="32" y="50" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="2.5" fill="#34d399">COMPUTER VISION<tspan fill="#8b949e"> · 2025</tspan></text>
    <text x="32" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="29" font-weight="800" letter-spacing="-.5" fill="#e6edf3">Unified Face Attend</text></g>
    <g><path d="M508 48 v-12 h12 M560 48 v-12 h-12 M508 76 v12 h12 M560 76 v12 h-12" stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="534" cy="58" r="8" stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M522 78 q12 -12 24 0" stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect class="gscan2" x="508" y="36" width="52" height="2.5" fill="#34d399"/></g>
    <g class="in" style="animation-delay:0.15s"><text x="32" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">Multi-face attendance at 98% precision, with active</text><text x="32" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">anti-spoofing and real-time Firebase cloud sync. Published</text><text x="32" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">at INCONSYM-2025.</text></g>
    <g class="in" style="animation-delay:0.30s"><g><rect x="32" y="230" width="65" height="26" rx="13" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.45"/><text x="64.5" y="247.32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#34d399">Python</text></g><g><rect x="105" y="230" width="65" height="26" rx="13" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.45"/><text x="137.5" y="247.32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#34d399">OpenCV</text></g><g><rect x="178" y="230" width="80" height="26" rx="13" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.45"/><text x="218" y="247.32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#34d399">DeepFace</text></g><g><rect x="266" y="230" width="80" height="26" rx="13" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.45"/><text x="306" y="247.32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#34d399">Firebase</text></g></g>
</svg>
