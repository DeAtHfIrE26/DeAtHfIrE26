<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 453" width="1200" height="453" role="img" aria-labelledby="t d">
<title id="t">Merkle Verify</title>
<desc id="d">ON-CHAIN VERIFICATION · SOLIDITY. An on-chain verification suite: a Merkle-proof verifier byte-compatible with OpenZeppelin, an ECDSA verifier that rejects malleable signatures (EIP-2), and a USDC transfer tracker indexed through a subgraph. The live visualizer lets you tamper with a proof and watch the verdict flip.</desc>
<defs>
    <clipPath id="pclip"><rect x="1" y="1" width="1198" height="451" rx="18"/></clipPath>
    <filter id="pblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="86"/></filter>
    <pattern id="pdots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#1b2433"/></pattern>
    <linearGradient id="pedge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f472b6" stop-opacity="0"/><stop offset=".5" stop-color="#f472b6"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient></defs>
<style>
  text{white-space:pre}
  .in{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.5)}}
  
    .blob{animation:drift 16s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
    .b2{animation-duration:19s;animation-direction:alternate-reverse}.b3{animation-duration:23s}
    @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6%,8%) scale(1.15)}100%{transform:translate(-5%,-4%) scale(.9)}}
    .sweep{stroke-dasharray:397 2909;animation:sweep 9s linear infinite}
    @keyframes sweep{to{stroke-dashoffset:-3306}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rm-show{opacity:1!important;transform:none!important}}
  @media (prefers-reduced-motion:reduce){.in,.px,.bdg{opacity:1!important}.tl{stroke-dashoffset:0!important}}
</style>

    <rect x="1" y="1" width="1198" height="451" rx="18" fill="#0f1520"/>
    
    <g clip-path="url(#pclip)" filter="url(#pblur)" opacity="0.35">
      <circle class="blob b1" cx="216" cy="90.60000000000001" r="264" fill="#f472b6"/>
      <circle class="blob b2" cx="1020" cy="158.54999999999998" r="216" fill="#22d3ee"/>
      <circle class="blob b3" cx="660" cy="475.65000000000003" r="240" fill="#a78bfa"/>
    </g>
    <rect x="1" y="1" width="1198" height="451" rx="18" fill="url(#pdots)" opacity="0.9"/>
    <rect x="1" y="1" width="1198" height="451" rx="18" fill="none" stroke="#263041" stroke-width="1.5"/>
    <rect x="1" y="1" width="1198" height="451" rx="18" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" class="sweep" opacity="0.75"/>
    <g class="in"><text x="48" y="58" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="14" font-weight="700" letter-spacing="3" fill="#f472b6">ON-CHAIN VERIFICATION · SOLIDITY</text></g>
    <g class="in" style="animation-delay:0.20s"><rect x="1034" y="36" width="118" height="30" rx="15" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".55"/><circle class="pulse" cx="1054" cy="51" r="5" fill="#34d399"/><text x="1068" y="56" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#34d399">LIVE APP</text></g>
    <g class="in" style="animation-delay:0.10s"><text x="48" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-1" fill="#e6edf3">Merkle Verify</text></g>
    <g class="in" style="animation-delay:0.20s"><text x="48" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" fill="#8b949e">An on-chain verification suite: a Merkle-proof verifier byte-compatible with OpenZeppelin, an ECDSA verifier</text><text x="48" y="179" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" fill="#8b949e">that rejects malleable signatures (EIP-2), and a USDC transfer tracker indexed through a subgraph. The live</text><text x="48" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" fill="#8b949e">visualizer lets you tamper with a proof and watch the verdict flip.</text></g>
    <g class="in" style="animation-delay:0.40s">
        <rect x="48" y="255" width="264" height="104" rx="14" fill="#151c28" stroke="#263041"/>
        <rect x="64" y="255" width="232" height="3" fill="#f472b6" opacity=".8"/>
        <text x="70" y="311" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#f472b6">278</text>
        <text x="70" y="339" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">tests in the engine</text>
      </g><g class="in" style="animation-delay:0.52s">
        <rect x="328" y="255" width="264" height="104" rx="14" fill="#151c28" stroke="#263041"/>
        <rect x="344" y="255" width="232" height="3" fill="#f472b6" opacity=".8"/>
        <text x="350" y="311" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#f472b6">12</text>
        <text x="350" y="339" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">leaf counts at OZ parity</text>
      </g><g class="in" style="animation-delay:0.64s">
        <rect x="608" y="255" width="264" height="104" rx="14" fill="#151c28" stroke="#263041"/>
        <rect x="624" y="255" width="232" height="3" fill="#f472b6" opacity=".8"/>
        <text x="630" y="311" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#f472b6">41</text>
        <text x="630" y="339" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">Solidity↔TS parity tests</text>
      </g><g class="in" style="animation-delay:0.76s">
        <rect x="888" y="255" width="264" height="104" rx="14" fill="#151c28" stroke="#263041"/>
        <rect x="904" y="255" width="232" height="3" fill="#f472b6" opacity=".8"/>
        <text x="910" y="311" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#f472b6">0</text>
        <text x="910" y="339" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">prod dependency vulns</text>
      </g>
    <g class="in" style="animation-delay:0.90s"><g><rect x="48" y="387" width="84" height="26" rx="13" fill="#f472b6" fill-opacity="0.1" stroke="#f472b6" stroke-opacity="0.45"/><text x="90" y="404.68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#f472b6">Solidity</text></g><g><rect x="140" y="387" width="77" height="26" rx="13" fill="#f472b6" fill-opacity="0.1" stroke="#f472b6" stroke-opacity="0.45"/><text x="178.5" y="404.68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#f472b6">Hardhat</text></g><g><rect x="225" y="387" width="92" height="26" rx="13" fill="#f472b6" fill-opacity="0.1" stroke="#f472b6" stroke-opacity="0.45"/><text x="271" y="404.68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#f472b6">The Graph</text></g><g><rect x="325" y="387" width="92" height="26" rx="13" fill="#f472b6" fill-opacity="0.1" stroke="#f472b6" stroke-opacity="0.45"/><text x="371" y="404.68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#f472b6">ethers.js</text></g><g><rect x="425" y="387" width="116" height="26" rx="13" fill="#f472b6" fill-opacity="0.1" stroke="#f472b6" stroke-opacity="0.45"/><text x="483" y="404.68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#f472b6">OpenZeppelin</text></g><g><rect x="549" y="387" width="84" height="26" rx="13" fill="#f472b6" fill-opacity="0.1" stroke="#f472b6" stroke-opacity="0.4