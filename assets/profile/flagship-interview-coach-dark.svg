        <text x="350" y="311" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#fbbf24">4</text>
        <text x="350" y="339" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">scoring dimensions</text>
      </g><g class="in" style="animation-delay:0.64s">
        <rect x="608" y="255" width="264" height="104" rx="14" fill="#151c28" stroke="#263041"/>
        <rect x="624" y="255" width="232" height="3" fill="#fbbf24" opacity=".8"/>
        <text x="630" y="311" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#fbbf24">92%+</text>
