<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 453" width="1200" height="453" role="img" aria-labelledby="t d">
<title id="t">AI Interview Coach</title>
<desc id="d">GEN AI · RAG · COMPUTER VISION. A multimodal interview platform with 5 assessment modes and no fixed question bank: an LLM + RAG engine writes resume-aware questions and scores answers on 4 dimensions, while lip-sync verification flags passive test-taking. IEEE ICCCNT 2025; patent filed.</desc>
<defs>
    <clipPath id="pclip"><rect x="1" y="1" width="1198" height="451" rx="18"/></clipPath>
    <filter id="pblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="86"/></filter>
    <pattern id="pdots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#1b2433"/></pattern>
    <linearGradient id="pedge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbbf24" stop-opacity="0"/><stop offset=".5" stop-color="#fbbf24"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient></defs>
<style>
  text{white-space:pre}
  .in{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.5)}}
  
    .blob{animation:drift 16s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
    .b2{animation-duration:19s;animation-direction:alternate-reverse}.b3{animation-duration:23s}
    @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6%,8%) scale(1.15)}100%{transform:translate(-5%,-4%) scale(.9)}}
    .sweep{stroke-dasharray:397 2909;animation:sweep 9s linear infinite}
    @keyframes sweep{to{stroke-dashoffset:-3306}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rm-show{opacity:1!important;transform:none!important}}
  @media (prefers-reduced-motion:reduce){.in,.px,.bdg{opacity:1!important}.tl{stroke-dashoffset:0!important}}
</style>

    <rect x="1" y="1" width="1198" height="451" rx="18" fill="#0f1520"/>
    
    <g clip-path="url(#pclip)" filter="url(#pblur)" opacity="0.35">
      <circle class="blob b1" cx="216" cy="90.60000000000001" r="264" fill="#fbbf24"/>
