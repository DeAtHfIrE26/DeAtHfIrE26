<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 112" width="1200" height="112" role="img" aria-labelledby="t d">
<title id="t">About me</title>
<desc id="d">01 — who I am</desc>
<defs><linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#6d28d9"/><stop offset=".6" stop-color="#0e7490"/><stop offset="1" stop-color="#047857" stop-opacity="0"/></linearGradient></defs>
<style>
  text{white-space:pre}
  .in{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.5)}}
  .grow{transform-origin:0 0;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) .2s both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .glint{animation:glint 5s ease-in-out 1.4s infinite}@keyframes glint{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(1150px);opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rm-show{opacity:1!important;transform:none!important}}
  @media (prefers-reduced-motion:reduce){.in,.px,.bdg{opacity:1!important}.tl{stroke-dashoffset:0!important}}
</style>

    <g class="in"><text x="4" y="34" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="15" font-weight="600" letter-spacing="4" fill="#6d28d9">01 / WHO I AM</text></g>
    <g class="in" style="animation-delay:0.10s"><text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1" fill="#1f2328">About me</text></g>
    <rect x="0" y="100" width="1200" height="2" fill="#d0d7de"/>
    <rect class="grow" x="0" y="99" width="300" height="4" rx="2" fill="url(#bar)"/>
    <circle class="glint" cx="20" cy="101" r="3.5" fill="#0e7490"/>
</svg>
