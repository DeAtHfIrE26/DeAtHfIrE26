<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" width="600" height="290" role="img" aria-labelledby="t d">
<title id="t">Turn-based Chess-like Game</title>
<desc id="d">REAL-TIME. Real-time multiplayer strategy on a 5×5 board, with game state synchronised over WebSockets. Built with JavaScript, Express, Socket.IO.</desc>
<defs>
    <clipPath id="cclip"><rect x="1" y="1" width="598" height="288" rx="18"/></clipPath>
    <filter id="cblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="43"/></filter>
    <pattern id="cdots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#eef1f5"/></pattern>
    <linearGradient id="cedge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b45309" stop-opacity="0"/><stop offset=".5" stop-color="#b45309"/><stop offset="1" stop-color="#0e7490" stop-opacity="0"/></linearGradient></defs>
<style>
  text{white-space:pre}
  .in{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.5)}}
  
    .blob{animation:drift 16s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
    .b2{animation-duration:19s;animation-direction:alternate-reverse}.b3{animation-duration:23s}
    @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6%,8%) scale(1.15)}100%{transform:translate(-5%,-4%) scale(.9)}}
    .sweep{stroke-dasharray:214 1566;animation:sweep 9s linear infinite}
    @keyframes sweep{to{stroke-dashoffset:-1780}}
  .gscan{animation:gs 2s ease-in-out infinite alternate}@keyframes gs{to{transform:translateY(20px)}}
  .gscan2{animation:gs2 2.2s ease-in-out infinite alternate}@keyframes gs2{to{transform:translateY(50px)}}
  .gdash{stroke-dasharray:140;animation:gd 2.4s linear infinite}@keyframes gd{from{stroke-dashoffset:280}to{stroke-dashoffset:0}}
  .gbar{transform-box:fill-box;transform-origin:center;animation:gb .8s ease-in-out infinite alternate}@keyframes gb{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
  .gdot{animation:gdot 1.2s ease-in-out infinite}@keyframes gdot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
  .gnode{transform-box:fill-box;transform-origin:center;animation:gn 1.6s ease-in-out infinite}@keyframes gn{50%{transform:scale(1.5);opacity:.6}}
  .gspin{animation:spin 3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .gcell{opacity:.25;animation:gc 1.8s ease-in-out infinite}@keyframes gc{30%{opacity:1}60%{opacity:.25}}
  .gjump{animation:gj 1s cubic-bezier(.3,0,.7,1) infinite alternate}@keyframes gj{to{transform:translateY(-22px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rm-show{opacity:1!important;transform:none!important}}
  @media (prefers-reduced-motion:reduce){.in,.px,.bdg{opacity:1!important}.tl{stroke-dashoffset:0!important}}
</style>

    <rect x="1" y="1" width="598" height="288" rx="18" fill="#ffffff"/>
    
    <g clip-path="url(#cclip)" filter="url(#cblur)" opacity="0.16">
      <circle class="blob b1" cx="108" cy="58" r="132" fill="#b45309"/>
      <circle class="blob b2" cx="510" cy="101.5" r="108" fill="#0e7490"/>
      <circle class="blob b3" cx="330" cy="304.5" r="120" fill="#6d28d9"/>
    </g>
    <rect x="1" y="1" width="598" height="288" rx="18" fill="url(#cdots)" opacity="0.7"/>
    <rect x="1" y="1" width="598" height="288" rx="18" fill="none" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="1" y="1" width="598" height="288" rx="18" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" class="sweep" opacity="0.55"/>
    <g class="in"><text x="32" y="50" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="2.5" fill="#b45309">REAL-TIME<tspan fill="#57606a"> · 2025</tspan></text>
    <text x="32" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="29" font-weight="800" letter-spacing="-.5" fill="#1f2328">Turn-based Chess-like Game</text></g>
    <g><rect class="gcell" style="animation-delay:0.00s" x="507" y="35" width="15" height="15" rx="3" fill="#b45309"/><rect class="gcell" style="animation-delay:0.18s" x="526" y="35" width="15" height="15" rx="3" fill="#b45309"/><rect class="gcell" style="animation-delay:0.36s" x="545" y="35" width="15" height="15" rx="3" fill="#b45309"/><rect class="gcell" style="animation-delay:0.54s" x="507" y="54" width="15" height="15" rx="3" fill="#b45309"/><rect class="gcell" style="animation-delay:0.72s" x="526" y="54" width="15" height="15" rx="3" fill="#b45309"/><rect class="gcell" style="animation-delay:0.90s" x="545" y="54" width="15" height="15" rx="3" fill="#b45309"/><rect class="gcell" style="animation-delay:1.08s" x="507" y="73" width="15" height="15" rx="3" fill="#b45309"/><rect class="gcell" style="animation-delay:1.26s" x="526" y="73" width="15" height="15" rx="3" fill="#b45309"/><rect class="gcell" style="animation-delay:1.44s" x="545" y="73" width="15" height="15" rx="3" fill="#b45309"/></g>
    <g class="in" style="animation-delay:0.15s"><text x="32" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" fill="#57606a">Real-time multiplayer strategy on a 5×5 board, with game</text><text x="32" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" fill="#57606a">state synchronised over WebSockets.</text></g>
    <g class="in" style="animation-delay:0.30s"><g><rect x="32" y="230" width="94" height="26" rx="13" fill="#b45309" fill-opacity="0.07" stroke="#b45309" stroke-opacity="0.45"/><text x="79" y="247.32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#b45309">JavaScript</text></g><g><rect x="134" y="230" width="72" height="26" rx="13" fill="#b45309" fill-opacity="0.07" stroke="#b45309" stroke-opacity="0.45"/><text x="170" y="247.32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#b45309">Express</text></g><g><rect x="214" y="230" width="87" height="26" rx="13" fill="#b45309" fill-opacity="0.07" stroke="#b45309" stroke-opacity="0.45"/><text x="257.5" y="247.32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#b45309">Socket.IO</text></g></g>
</svg>
