<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 137 42" width="137" height="42" role="img" aria-label="Coach UI">
<title>Coach UI</title>
<defs><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="cl"><rect width="137" height="42" rx="11"/></clipPath></defs>
