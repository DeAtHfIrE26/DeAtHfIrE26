<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 497" width="1200" height="497" role="img" aria-labelledby="t d">
<title id="t">HealthHubPro</title>
<desc id="d">HEALTH · TIME SERIES · A11Y. Health tracking on a 26-endpoint TypeScript API with a Redis cache, InfluxDB time series for 6 biometric signals, and Kubernetes deploys watched by Prometheus, Grafana and Sentry. Streams a 300 MB Apple Health export in 4 MB slices.</desc>
<defs>
    <clipPath id="pclip"><rect x="1" y="1" width="1198" height="495" rx="18"/></clipPath>
    <filter id="pblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="86"/></filter>
    <pattern id="pdots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#eef1f5"/></pattern>
    <linearGradient id="pedge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#047857" stop-opacity="0"/><stop offset=".5" stop-color="#047857"/><stop offset="1" stop-color="#0e7490" stop-opacity="0"/></linearGradient></defs>
<style>
  text{white-space:pre}
  .in{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.5)}}
  
    .blob{animation:drift 16s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
    .b2{animation-duration:19s;animation-direction:alternate-reverse}.b3{animation-duration:23s}
    @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6%,8%) scale(1.15)}100%{transform:translate(-5%,-4%) scale(.9)}}
    .sweep{stroke-dasharray:407 2987;animation:sweep 9s linear infinite}
    @keyframes sweep{to{stroke-dashoffset:-3394}}.shrink{transform-box:fill-box;transform-origin:left center;transform:scaleX(var(--s));animation:shrink 1.6s cubic-bezier(.3,.7,.2,1) both}
    @keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(var(--s))}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rm-show{opacity:1!important;transform:none!important}}
  @media (prefers-reduced-motion:reduce){.in,.px,.bdg{opacity:1!important}.tl{stroke-dashoffset:0!important}}
</style>

    <rect x="1" y="1" width="1198" height="495" rx="18" fill="#ffffff"/>
    
    <g clip-path="url(#pclip)" filter="url(#pblur)" opacity="0.16">
      <circle class="blob b1" cx="216" cy="99.4" r="264" fill="#047857"/>
      <circle class="blob b2" cx="1020" cy="173.95" r="216" fill="#0e7490"/>
      <circle class="blob b3" cx="660" cy="521.85" r="240" fill="#6d28d9"/>
    </g>
    <rect x="1" y="1" width="1198" height="495" rx="18" fill="url(#pdots)" opacity="0.7"/>
    <rect x="1" y="1" width="1198" height="495" rx="18" fill="none" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="1" y="1" width="1198" height="495" rx="18" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" class="sweep" opacity="0.55"/>
    <g class="in"><text x="48" y="58" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="14" font-weight="700" letter-spacing="3" fill="#047857">HEALTH · TIME SERIES · A11Y</text></g>
    <g class="in" style="animation-delay:0.20s"><rect x="1034" y="36" width="118" height="30" rx="15" fill="#047857" fill-opacity=".12" stroke="#047857" stroke-opacity=".55"/><circle class="pulse" cx="1054" cy="51" r="5" fill="#047857"/><text x="1068" y="56" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#047857">LIVE APP</text></g>
    <g class="in" style="animation-delay:0.10s"><text x="48" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-1" fill="#1f2328">HealthHubPro</text></g>
    <g class="in" style="animation-delay:0.20s"><text x="48" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" fill="#57606a">Health tracking on a 26-endpoint TypeScript API with a Redis cache, InfluxDB time series for 6 biometric</text><text x="48" y="179" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" fill="#57606a">signals, and Kubernetes deploys watched by Prometheus, Grafana and Sentry. Streams a 300 MB Apple Health export</text><text x="48" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" fill="#57606a">in 4 MB slices.</text></g>
    <text x="48" y="255" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" letter-spacing="3" fill="#57606a">MEASURED · BEFORE → AFTER</text><g class="in" style="animation-delay:0.40s">
        <text x="48" y="303" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" fill="#1f2328">Chart chunk, gzipped</text>
        <rect x="380" y="289" width="400" height="16" rx="8" fill="#afb8c1" fill-opacity="0.35"/>
        <rect class="shrink" style="--s:0.0212;animation-delay:0.80s" x="380" y="289" width="400" height="16" rx="8" fill="#047857"/>
        <text x="800" y="303" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="15" fill="#57606a">99.38 kB → <tspan fill="#1f2328" font-weight="700">2.11 kB</tspan></text>
        <text x="1152" y="303" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#047857">47× smaller</text>
      </g><g class="in" style="animation-delay:0.52s">
        <text x="48" y="347" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" fill="#1f2328">Dashboard payload</text>
        <rect x="380" y="333" width="400" height="16" rx="8" fill="#afb8c1" fill-opacity="0.35"/>
        <rect class="shrink" style="--s:0.4922;animation-delay:0.95s" x="380" y="333" width="400" height="16" rx="8" fill="#047857"/>
        <text x="800" y="347" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="15" fill="#57606a">766 kB → <tspan fill="#1f2328" font-weight="700">377 kB</tspan></text>
        <text x="1152" y="347" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#047857">2.0× smaller</text>
      </g><g class="in" style="animation-delay:0.64s">
        <text x="48" y="391" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" fill="#1f2328">Total blocking time, mobile</text>
        <rect x="380" y="377" width="400" height="16" rx="8" fill="#afb8c1" fill-opacity="0.35"/>
        <rect class="shrink" style="--s:0.5014;animation-delay:1.10s" x="380" y="377" width="400" height="16" rx="8" fill="#047857"/>
        <text x="800" y="391" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="15" fill="#57606a">349 ms → <tspan fill="#1f2328" font-weight="700">175 ms</tspan></text>
        <text x="1152" y="391" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#047857">−50%</text>
      </g>
    <g class="in" style="animation-delay:0.90s"><g><rect x="48" y="431" width="100" height="26" rx="13" fill="#047857" fill-opacity="0.07" stroke="#047857" stroke-opacity="0.45"/><text x="98" y="448.68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#047857">TypeScript</text></g><g><rect x="156" y="431" width="77" height="26" rx="13" fill="#047857" fill-opacity="0.07" stroke="#047857" stroke-opacity="0.45"/><text x="194.5" y="448.68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#047857">Node.js</text></g><g><rect x="241" y="431" width="100" height="26" rx="13" fill="#047857" fill-opacity="0.07" stroke="#047857" stroke-opacity="0.45"/><text x="291" y="448.68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#047857">PostgreSQL</text></g><g><rect x="349" y="431" width="61" height="26" rx="13" fill="#047857" fill-opacity="0.07" stroke="#047857" stroke-opacity="0.45"/><text x="379.5" y="448.68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#047857">Redis</text></g><g><rect x="418" y="431" width="84" height="26" rx="13" fill="#047857" fill-opacity="0.07" stroke="#047857" stroke-opacity="0.45"/><text x="460" y="448.68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#047857">InfluxDB</text></g><g><rect x="510" y="431" width="100" height="26" rx="13" fill="#047857" fill-opacity="0.07" stroke="#047857" stroke-opacity="0.45"/><text x="560" y="448.68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#047857">Kubernetes</text></g><g><rect x="618" y="431" width="84" height="26" rx="13" fill="#047857" fill-opacity="0.07" stroke="#047857" stroke-opacity="0.45"/><text x="660" y="448.68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#047857">React 18</text></g></g>
</svg>
