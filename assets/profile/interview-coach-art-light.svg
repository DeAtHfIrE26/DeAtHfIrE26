<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
<title id="t">AI Interview Coach</title>
<desc id="d">Animated illustration: facial landmarks tracked on a face, a scan line, mouth movement in sync with a voice waveform, and verification badges for face, lip-sync and voice.</desc>
<defs>
    <clipPath id="iaclip"><rect x="1" y="1" width="1198" height="398" rx="18"/></clipPath>
    <filter id="iablur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="86"/></filter>
    <pattern id="iadots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#eef1f5"/></pattern>
    <linearGradient id="iaedge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b45309" stop-opacity="0"/><stop offset=".5" stop-color="#b45309"/><stop offset="1" stop-color="#6d28d9" stop-opacity="0"/></linearGradient></defs>
<style>
  text{white-space:pre}
  .in{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.5)}}
  
    .blob{animation:drift 16s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
    .b2{animation-duration:19s;animation-direction:alternate-reverse}.b3{animation-duration:23s}
    @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6%,8%) scale(1.15)}100%{transform:translate(-5%,-4%) scale(.9)}}
    .sweep{stroke-dasharray:384 2816;animation:sweep 9s linear infinite}
    @keyframes sweep{to{stroke-dashoffset:-3200}}
    .sc{animation:sc 3s ease-in-out infinite alternate}@keyframes sc{from{transform:translateY(0)}to{transform:translateY(270px)}}
    .mouth{transform-box:fill-box;transform-origin:top center;animation:talk .9s ease-in-out infinite alternate}@keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(1.15)}}
    .wv{transform-box:fill-box;transform-origin:center;animation:wv .9s ease-in-out infinite alternate}@keyframes wv{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
    .blinkeye{transform-box:fill-box;transform-origin:center;animation:be 5s infinite}@keyframes be{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
    .corner{animation:cp 2s ease-in-out infinite}@keyframes cp{50%{opacity:.35}}
    .bdg{opacity:0;animation:bdg 9s infinite}@keyframes bdg{0%{opacity:0;transform:translateX(12px)}8%,80%{opacity:1;transform:none}90%,100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rm-show{opacity:1!important;transform:none!important}}
  @media (prefers-reduced-motion:reduce){.in,.px,.bdg{opacity:1!important}.tl{stroke-dashoffset:0!important}}
</style>

