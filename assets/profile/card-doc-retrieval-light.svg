<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" width="600" height="290" role="img" aria-labelledby="t d">
<title id="t">Document Retrieval System</title>
<desc id="d">SEARCH INFRA. Graph-backed document retrieval on Neo4j with transformer embeddings, containerised with Docker and Kubernetes. Built with Python, FastAPI, Neo4j, Docker.</desc>
<defs>
    <clipPath id="cclip"><rect x="1" y="1" width="598" height="288" rx="18"/></clipPath>
    <filter id="cblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="43"/></filter>
    <pattern id="cdots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#eef1f5"/></pattern>
    <linearGradient id="cedge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0e7490" stop-opacity="0"/><stop offset=".5" stop-color="#0e7490"/><stop offset="1" stop-color="#0e7490" stop-opacity="0"/></linearGradient></defs>
<style>
  text{white-space:pre}
  .in{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.5)}}
  
    .blob{animation:drift 16s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
    .b2{animation-duration:19s;animation-direction:alternate-reverse}.b3{animation-duration:23s}
    @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6%,8%) scale(1.15)}100%{transform:translate(-5%,-4%) scale(.9)}}
    .sweep{stroke-dasharray:214 1566;animation:sweep 9s linear infinite}
    @keyframes sweep{to{stroke-dashoffset:-1780}}
  .gscan{animation:gs 2s ease-in-out infinite alternate}@keyframes gs{to{transform:translateY(20px)}}
  .gscan2{animation:gs2 2.2s ease-in-out infinite alternate}@keyframes gs2{to{transform:translateY(50px)}}
  .gdash{stroke-dasharray:36 110;animation:gd 1.8s linear infinite}@keyframes gd{from{stroke-dashoffset:146}to{stroke-dashoffset:0}}
  .gbar{transform-box:fill-box;transform-origin:center;animation:gb .8s ease-in-out infinite alternate}@keyframes gb{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
  .gdot{animation:gdot 1.2s ease-in-out infinite}@keyframes gdot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
  .gnode{transform-box:fill-box;transform-origin:center;animation:gn 1.6s ease-in-out infinite}@keyframes gn{50%{transform:scale(1.5);opacity:.6}}
  .gspin{animation:spin 3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .gcell{opacity:.25;animation:gc 1.8s ease-in-out infinite}@keyframes gc{30%{opacity:1}60%{opacity:.25}}
  .gjump{animation:gj 1s cubic-bezier(.3,0,.7,1) infinite alternate}@keyframes gj{to{transform:translateY(-22px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rm-show{opacity:1!important;transform:none!important}}
  @media (prefers-reduced-motion:reduce){.in,.px,.bdg{opacity:1!important}.tl{stroke-dashoffset:0!important}}
</style>

    <rect x="1" y="1" width="598" height="288" rx="18" fill="#ffffff"/>
    
    <g clip-path="url(#cclip)" filter="url(#cblur)" opacity="0.16">
      <circle class="blob b1" cx="108" cy="58" r="132" fill="#0e7490"/>
      <circle class="blob b2" cx="510" cy="101.5" r="108" fill="#0e7490"/>
      <circle class="blob b3" cx="330" cy="304.5" r="120" fill="#6d28d9"/>
    </g>
    <rect x="1" y="1" width="598" height="288" rx="18" fill="url(#cdots)" opacity="0.7"/>
    <rect x="1" y="1" width="598" height="288" rx="18" fill="none" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="1" y="1" width="598" height="288" rx="18" fill="none" stroke="#0e7490" stroke-width="2" stroke-linecap="round" class="sweep" opacity="0.55"/>
    <g class="in"><text x="32" y="50" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="2.5" fill="#0e7490">SEARCH INFRA<tspan fill="#57606a"> · 2024</tspan></text>
    <text x="32" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="29" font-weight="800" letter-spacing="-.5" fill="#1f2328">Document Retrieval System</text></g>
    <g><path d="M510,46 L556,40 L560,78 L524,82 Z M510,46 L560,78" stroke="#0e7490" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/><circle class="gnode" style="animation-delay:0.0s" cx="510" cy="46" r="6" fill="#0e7490"/><circle class="gnode" style="animation-delay:0.4s" cx="556" cy="40" r="6" fill="#0e7490"/><circle class="gnode" style="animation-delay:0.8s" cx="524" cy="82" r="6" fill="#0e7490"/><circle class="gnode" style="animation-delay:1.2s" cx="560" cy="78" r="6" fill="#0e7490"/></g>
    <g class="in" style="animation-delay:0.15s"><text x="32" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" fill="#57606a">Graph-backed document retrieval on Neo4j with transformer</text><text x="32" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" fill="#57606a">embeddings, containerised with Docker and Kubernetes.</text></g>
    <g class="in" style="animation-delay:0.30s"><g><rect x="32" y="230" width="65" height="26" rx="13" fill="#0e7490" fill-opacity="0.07" stroke="#0e7490" stroke-opacity="0.45"/><text x="64.5" y="247.32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#0e7490">Python</text></g><g><rect x="105" y="230" width="72" height="26" rx="13" fill="#0e7490" fill-opacity="0.07" stroke="#0e7490" stroke-opacity="0.45"/><text x="141" y="247.32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#0e7490">FastAPI</text></g><g><rect x="185" y="230" width="58" height="26" rx="13" fill="#0e7490" fill-opacity="0.07" stroke="#0e7490" stroke-opacity="0.45"/><text x="214" y="247.32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#0e7490">Neo4j</text></g><g><rect x="251" y="230" width="65" height="26" rx="13" fill="#0e7490" fill-opacity="0.07" stroke="#0e7490" stroke-opacity="0.45"/><text x="283.5" y="247.32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#0e7490">Docker</text></g></g>
</svg>
