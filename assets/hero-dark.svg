<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d">
  <title id="t">Kashyap Patel — full-stack engineer</title>
  <desc id="d">Full-stack engineer working across .NET, React, Python and cloud. Measured results from recent projects are typed out in turn: doc pipeline: 230 s → 2.9 s per upload; dashboard API: 828 ms → 419 ms; a 99 kB chart, rebuilt in 2 kB; Merkle proofs matched to OpenZeppelin.</desc>
  <style>
    .name{font:700 56px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#e6edf3;letter-spacing:-1px}
    .role{font:400 23px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#8b949e}
    .label{font:500 15px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#8b949e}
    .prompt{font:600 24px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#a78bfa}
    .type{font:500 24px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#e6edf3}
    .fade{opacity:0;animation:fade .8s ease-out forwards}
    .slot{opacity:0;animation:slot 16s linear infinite}
    .cover{animation:type 16s infinite}
    .caret{animation:blink 1s steps(1) infinite}
    .edge{stroke:#30363d;stroke-width:2.5;stroke-dasharray:120;stroke-dashoffset:120;animation:draw .7s ease-out forwards}
    .edge.path{animation:draw .7s ease-out forwards,pathOn 6s ease-in-out 1.6s infinite}
    .edge.sib{animation:draw .7s ease-out forwards,sibOn 6s ease-in-out 1.6s infinite}
    .node{fill:#161b22;stroke:#30363d;stroke-width:2.5;opacity:0;animation:pop .5s ease-out forwards}
    .node.pathN{animation:pop .5s ease-out forwards,pathNode 6s ease-in-out 1.6s infinite}
    .node.sibN{animation:pop .5s ease-out forwards,sibNode 6s ease-in-out 1.6s infinite}
    .node.rootN{fill:#a78bfa33;stroke:#a78bfa;animation:pop .5s ease-out forwards,pulse 6s ease-in-out 1.6s infinite}
    .legend{font:500 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#8b949e}
    @keyframes fade{to{opacity:1}}
    @keyframes slot{0%,24.9%{opacity:1}25%,100%{opacity:0}}
    @keyframes type{
      0%{transform:translateX(0);animation-timing-function:steps(28,end)}
      11%{transform:translateX(var(--w))}
      21%{transform:translateX(var(--w));animation-timing-function:ease-in}
      24%,100%{transform:translateX(0)}
    }
    @keyframes blink{0%{opacity:1}50%{opacity:0}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes pathOn{0%,15%,85%,100%{stroke:#30363d}30%,70%{stroke:#a78bfa}}
    @keyframes sibOn{0%,15%,85%,100%{stroke:#30363d}30%,70%{stroke:#34d399}}
    @keyframes pathNode{0%,15%,85%,100%{stroke:#30363d}30%,70%{stroke:#a78bfa}}
    @keyframes sibNode{0%,15%,85%,100%{stroke:#30363d}30%,70%{stroke:#34d399}}
    @keyframes pulse{0%,20%,80%,100%{stroke-width:2.5}40%,60%{stroke-width:5}}
    @media (prefers-reduced-motion:reduce){
      *{animation:none!important}
      .fade,.node,.slot:first-of-type{opacity:1}
      .edge{stroke-dashoffset:0}
      .cover{transform:translateX(9999px)}
    }
  </style>
  <rect x="1" y="1" width="958" height="298" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <g class="fade" style="animation-delay:0s">
    <text x="48" y="62" class="label">~/DeAtHfIrE26 · India</text>
  </g>
  <g class="fade" style="animation-delay:.15s">
    <text x="46" y="128" class="name">Kashyap Patel</text>
  </g>
  <g class="fade" style="animation-delay:.3s">
    <text x="48" y="164" class="role">Full-stack engineer · .NET · React · Python · cloud</text>
  </g>
  <g class="fade" style="animation-delay:.45s">
    <text x="48" y="214" class="prompt">$</text>
    <g class="slot" style="animation-delay:0s">
      <text x="78" y="214" class="type" textLength="547" lengthAdjust="spacingAndGlyphs">doc pipeline: 230 s → 2.9 s per upload</text>
      <g class="cover" style="--w:547px;animation-delay:0s">
        <rect x="76" y="190" width="587" height="34" fill="#161b22"/>
        <rect class="caret" x="76" y="193" width="12" height="26" rx="2" fill="#a78bfa"/>
      </g>
    </g>
    <g class="slot" style="animation-delay:-12s">
      <text x="78" y="214" class="type" textLength="432" lengthAdjust="spacingAndGlyphs">dashboard API: 828 ms → 419 ms</text>
      <g class="cover" style="--w:432px;animation-delay:-12s">
        <rect x="76" y="190" width="472" height="34" fill="#161b22"/>
        <rect class="caret" x="76" y="193" width="12" height="26" rx="2" fill="#a78bfa"/>
      </g>
    </g>
    <g class="slot" style="animation-delay:-8s">
      <text x="78" y="214" class="type" textLength="432" lengthAdjust="spacingAndGlyphs">a 99 kB chart, rebuilt in 2 kB</text>
      <g class="cover" style="--w:432px;animation-delay:-8s">
        <rect x="76" y="190" width="472" height="34" fill="#161b22"/>
        <rect class="caret" x="76" y="193" width="12" height="26" rx="2" fill="#a78bfa"/>
      </g>
    </g>
    <g class="slot" style="animation-delay:-4s">
      <text x="78" y="214" class="type" textLength="533" lengthAdjust="spacingAndGlyphs">Merkle proofs matched to OpenZeppelin</text>
      <g class="cover" style="--w:533px;animation-delay:-4s">
        <rect x="76" y="190" width="573" height="34" fill="#161b22"/>
        <rect class="caret" x="76" y="193" width="12" height="26" rx="2" fill="#a78bfa"/>
      </g>
    </g>
  </g>
  <g>
    <line x1="690" y1="236" x2="725" y2="166" class="edge " style="animation-delay:0.2s"/><line x1="760" y1="236" x2="725" y2="166" class="edge " style="animation-delay:0.3s"/><line x1="830" y1="236" x2="865" y2="166" class="edge path" style="animation-delay:0.4s"/><line x1="900" y1="236" x2="865" y2="166" class="edge sib" style="animation-delay:0.5s"/><line x1="725" y1="166" x2="795" y2="92" class="edge sib" style="animation-delay:0.8s"/><line x1="865" y1="166" x2="795" y2="92" class="edge path" style="animation-delay:0.9s"/>
    <rect x="677" y="223" width="26" height="26" rx="6" class="node " style="animation-delay:0s"/><rect x="747" y="223" width="26" height="26" rx="6" class="node " style="animation-delay:0.05s"/><rect x="817" y="223" width="26" height="26" rx="6" class="node pathN" style="animation-delay:0.1s"/><rect x="887" y="223" width="26" height="26" rx="6" class="node sibN" style="animation-delay:0.15s"/><rect x="712" y="153" width="26" height="26" rx="6" class="node sibN" style="animation-delay:0.6s"/><rect x="852" y="153" width="26" height="26" rx="6" class="node pathN" style="animation-delay:0.65s"/><rect x="779" y="76" width="32" height="32" rx="6" class="node rootN" style="animation-delay:1.1s"/>
  </g>
  <g class="fade" style="animation-delay:1.4s">
    <rect x="686" y="270" width="10" height="10" rx="2" fill="#a78bfa"/>
    <text x="702" y="279" class="legend">proof path</text>
    <rect x="806" y="270" width="10" height="10" rx="2" fill="#34d399"/>
    <text x="822" y="279" class="legend">siblings</text>
  </g>
</svg>
